name: Build

# Builds an unsigned release APK and uploads it as an artifact. Signing happens offline with the
# fork owner's key, so no signing secrets live on GitHub.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unsigned release APK
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk mealient-release-unsigned.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mealient-release-unsigned
          path: mealient-release-unsigned.apk
